name: Deploy Socket Server to AWS ECS

on:
  push:
    branches:
      - main
    paths:
      # Workflow này CHỈ chạy khi bạn chỉnh sửa các file liên quan tới Backend (tránh lãng phí chạy khi chỉ sửa giao diện)
      - 'server/**'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/deploy-socket-ecs.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: p2p-socket-server
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Force ECS to deploy new code (Zero-downtime)
      run: |
        aws ecs update-service \
          --cluster clusterr-p2p-socket-server \
          --service task-definition-p2p-socket-server-service-2 \
          --force-new-deployment \
          --region ap-southeast-1
